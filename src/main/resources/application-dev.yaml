# 给所有的接口前缀添加一个api
server:
  servlet:
    context-path: /api
  # 端口
  port: 9091
# 数据库链接
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/0902-demo?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  data:
    redis:
      host: localhost # Redis 服务地址
      port: 6379 # Redis 端口
      password: "" # Redis 密码（空表示无密码）
      database: 0 # 使用的 Redis 数据库索引（0-15）
      timeout: 3000ms # 连接超时时间
      lettuce:
        pool:
          max-active: 8 # 连接池最大连接数
          max-idle: 8 # 连接池最大空闲连接数
          min-idle: 0 # 连接池最小空闲连接数
          max-wait: -1ms # 连接池最大阻塞等待时间（-1 表示不限）
  # sa-token配置
  sa-token:
    # token名称 (同时也是cookie名称)
    token-name: Authorization
    # token有效期，单位s 默认30天, -1代表永不过期
    timeout: 2592000
    # token临时有效期 (指定时间内无操作就视为token过期) 单位: 秒
    activity-timeout: -1
    # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
    allow-concurrent-login: false
    # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
    is-share: false
    # token风格
    token-style: uuid
mybatis-plus:
  mapper-locations:
    - classpath*:/mapper/**/*.xml